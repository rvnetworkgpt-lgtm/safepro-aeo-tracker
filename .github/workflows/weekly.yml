name: Weekly AEO tracking

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 9:00 AM IST
  workflow_dispatch:        # "Run workflow" button for test runs
    inputs:
      limit:
        description: "Only the first N prompts (blank = all 100)"
        required: false
      engines:
        description: "Comma list, e.g. claude,perplexity (blank = all with keys)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tracker
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          WEEK1_DATE: ${{ vars.WEEK1_DATE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.engines }}" ]; then ARGS="$ARGS --engines ${{ inputs.engines }}"; fi
          python tracker.py $ARGS
